

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EmotionAid - Your AI Emotional Intelligence Coach{% endblock %}</title>
    
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts - Warm, friendly typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@600;700;800&display=swap" rel="stylesheet">
    
    <!-- Custom Tailwind configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4F46E5',      // Warm indigo
                        secondary: '#06B6D4',    // Cyan
                        accent: '#F59E0B',       // Amber
                        warm: '#FEF3C7',         // Warm yellow
                        calm: '#DBEAFE',         // Calm blue
                        growth: '#D1FAE5',       // Growth green
                    },
                    fontFamily: {
                        sans: ['DM Sans', 'sans-serif'],
                        display: ['Fraunces', 'serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <style>
        /* Smooth scrolling */
        html {
            scroll-behavior: smooth;
        }
        
        /* Custom gradient backgrounds */
        .gradient-warm {
            background: linear-gradient(135deg, #FEF3C7 0%, #FDE68A 100%);
        }
        
        .gradient-calm {
            background: linear-gradient(135deg, #DBEAFE 0%, #BFDBFE 100%);
        }
        
        .gradient-growth {
            background: linear-gradient(135deg, #D1FAE5 0%, #A7F3D0 100%);
        }
        
        /* Subtle hover effects */
        .nav-link {
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 50%;
            width: 0;
            height: 2px;
            background: #4F46E5;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateX(-50%);
        }
        
        .nav-link:hover::after {
            width: 100%;
        }
        
        /* Animated background elements */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }
        
        .float-animation {
            animation: float 6s ease-in-out infinite;
        }
        
        .float-animation-delay {
            animation: float 6s ease-in-out infinite;
            animation-delay: 2s;
        }
        
        /* Smooth fade-in for messages */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .alert {
            animation: fadeIn 0.4s ease-out;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }
        
        ::-webkit-scrollbar-track {
            background: #F3F4F6;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #4F46E5;
            border-radius: 5px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #4338CA;
        }
    </style>
    
    {% block extra_css %}{% endblock %}
    {% block extra_head %}{% endblock %}
</head>
<body class="flex flex-col min-h-screen bg-gradient-to-br from-white via-indigo-50/30 to-cyan-50/30">
    
    <!-- Navbar -->
    {% include 'base/navbar.html' %}
    
    <!-- Messages/Alerts with enhanced styling -->
    {% if messages %}
    <div class="container mx-auto px-4 mt-6">
        {% for message in messages %}
        <div class="alert p-4 rounded-xl mb-4 shadow-lg border-l-4 backdrop-blur-sm
            {% if message.tags == 'success' %}
                bg-green-50/90 text-green-800 border-green-500
            {% elif message.tags == 'error' %}
                bg-red-50/90 text-red-800 border-red-500
            {% elif message.tags == 'warning' %}
                bg-amber-50/90 text-amber-800 border-amber-500
            {% else %}
                bg-blue-50/90 text-blue-800 border-blue-500
            {% endif %}">
            <div class="flex items-center">
                <i class="fas 
                    {% if message.tags == 'success' %}fa-check-circle
                    {% elif message.tags == 'error' %}fa-exclamation-circle
                    {% elif message.tags == 'warning' %}fa-exclamation-triangle
                    {% else %}fa-info-circle
                    {% endif %} 
                    mr-3 text-lg"></i>
                <span class="font-medium">{{ message }}</span>
            </div>
        </div>
        {% endfor %}
    </div>
    {% endif %}
    
    <!-- Main Content -->
    <main class="flex-grow container mx-auto px-4 py-8">
        {% block content %}
        <!-- Page content goes here -->
        {% endblock %}
    </main>
    
    <!-- Footer -->
    <div class="{% block hide_footer %}{% endblock %}">
        {% include 'base/footer.html' %}
    </div>
    
    <!-- JavaScript -->
    {% block extra_js %}{% endblock %}
    
    <!-- Alpine.js for interactivity -->
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</body>
</html>
