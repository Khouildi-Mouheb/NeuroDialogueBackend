{% extends 'base/base.html' %}

{% block title %}Chat - EmotionAid{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <!-- Chat Header -->
    <div class="bg-white rounded-xl shadow-lg p-6 mb-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Emotional Intelligence Chat</h1>
        <p class="text-gray-600">Speak with our AI coach about your feelings and thoughts</p>
    </div>

    <!-- Chat Container -->
    <div class="bg-white rounded-xl shadow-lg p-6">
        <!-- Messages Area -->
        <div id="messages" class="messages h-96 border border-gray-200 rounded-lg p-4 mb-4 overflow-y-auto bg-gray-50">
            <!-- Messages will appear here -->
        </div>

        <!-- Input Form -->
        <form id="chat-form" class="flex gap-3">
            <input 
                type="text" 
                id="text" 
                name="text" 
                placeholder="Type your message here..." 
                required
                class="flex-grow px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
            >
            <button 
                type="submit"
                class="bg-primary hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-medium transition duration-300"
            >
                Send
            </button>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
const form = document.getElementById("chat-form");
const messages = document.getElementById("messages");

// Auto-scroll to bottom
function scrollToBottom() {
    messages.scrollTop = messages.scrollHeight;
}

form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const input = document.getElementById("text");
    const text = input.value;

    // Create and append user message
    const userMessage = document.createElement("div");
    userMessage.className = "mb-4 text-right";
    userMessage.innerHTML = `
        <div class="inline-block bg-primary text-white rounded-lg rounded-tr-none px-4 py-2 max-w-xs">
            ${text}
        </div>
        <div class="text-xs text-gray-500 mt-1">
            <i class="fas fa-user mr-1"></i>You • Just now
        </div>
    `;
    messages.appendChild(userMessage);
    scrollToBottom();

    // Clear input
    input.value = "";
    
    // Show typing indicator
    const typingIndicator = document.createElement("div");
    typingIndicator.className = "mb-4 text-left";
    typingIndicator.innerHTML = `
        <div class="inline-block bg-gray-200 text-gray-700 rounded-lg rounded-tl-none px-4 py-2">
            <div class="typing-indicator">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
        </div>
    `;
    messages.appendChild(typingIndicator);
    scrollToBottom();

    try {
        const response = await fetch(
            `/chat/{{ chat.id }}/send/?text=${encodeURIComponent(text)}`
        );

        const data = await response.json();

        // Remove typing indicator
        messages.removeChild(typingIndicator);

        if (data.response) {
            const botMessage = document.createElement("div");
            botMessage.className = "mb-4 text-left";
            botMessage.innerHTML = `
                <div class="inline-block bg-gray-100 text-gray-800 rounded-lg rounded-tl-none px-4 py-2 max-w-xs">
                    ${data.response}
                </div>
                <div class="text-xs text-gray-500 mt-1">
                    <i class="fas fa-robot mr-1"></i>AI Coach • Just now
                </div>
            `;
            messages.appendChild(botMessage);
        } else if (data.error) {
            const errorMessage = document.createElement("div");
            errorMessage.className = "mb-4 text-center";
            errorMessage.innerHTML = `
                <div class="inline-block bg-red-100 text-red-700 rounded-lg px-4 py-2">
                    <i class="fas fa-exclamation-circle mr-2"></i>${data.error}
                </div>
            `;
            messages.appendChild(errorMessage);
        }

        scrollToBottom();

    } catch (err) {
        // Remove typing indicator
        messages.removeChild(typingIndicator);
        
        const errorMessage = document.createElement("div");
        errorMessage.className = "mb-4 text-center";
        errorMessage.innerHTML = `
            <div class="inline-block bg-red-100 text-red-700 rounded-lg px-4 py-2">
                <i class="fas fa-exclamation-triangle mr-2"></i>Network error. Please try again.
            </div>
        `;
        messages.appendChild(errorMessage);
        scrollToBottom();
    }
});

// Initial welcome message when page loads
window.addEventListener('DOMContentLoaded', () => {
    const welcomeMessage = document.createElement("div");
    welcomeMessage.className = "mb-4 text-left";
    welcomeMessage.innerHTML = `
        <div class="inline-block bg-gray-100 text-gray-800 rounded-lg rounded-tl-none px-4 py-2 max-w-xs">
            Hello! I'm here to listen and support you. How are you feeling today?
        </div>
        <div class="text-xs text-gray-500 mt-1">
            <i class="fas fa-robot mr-1"></i>AI Coach • Just now
        </div>
    `;
    messages.appendChild(welcomeMessage);
    scrollToBottom();
});

// Allow Enter key to submit (but allow Shift+Enter for new line)
document.getElementById('text').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        document.getElementById('chat-form').dispatchEvent(new Event('submit'));
    }
});
</script>

<style>
.messages {
    white-space: pre-wrap;
    word-wrap: break-word;
}

.typing-indicator {
    display: inline-flex;
    align-items: center;
}

.typing-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background-color: #6b7280;
    margin: 0 2px;
    animation: typing 1.4s infinite ease-in-out;
}

.typing-dot:nth-child(1) { animation-delay: -0.32s; }
.typing-dot:nth-child(2) { animation-delay: -0.16s; }

@keyframes typing {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
}
</style>
{% endblock %}
